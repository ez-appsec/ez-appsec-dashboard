# ez-appsec GitHub security dashboard — managed by ez-appsec
# DO NOT EDIT — update:web will overwrite this file from the ez-appsec source.
#
# This workflow aggregates vulnerability data from all projects and deploys to GitHub Pages.
# Consuming projects push scan results here via update:vulns in github-scan.yml.

name: Deploy Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Aggregate vulnerability data into index.json
        run: |
          # Download and run the aggregate-index.py script from ez-appsec repo
          # This script correctly reads from data/vulnerabilities/**/*.json
          curl -sSfL "https://raw.githubusercontent.com/ez-appsec/ez-appsec/main/github/dashboard/aggregate-index.py" \
            -o /tmp/aggregate-index.py
          python3 /tmp/aggregate-index.py data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
