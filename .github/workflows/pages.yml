# ez-appsec GitHub security dashboard — managed by ez-appsec
# DO NOT EDIT — update:web will overwrite this file from the ez-appsec source.
#
# This workflow deploys the dashboard to GitHub Pages on every push to main.
# Consuming projects push scan results here via update:vulns in github-scan.yml.

name: Deploy Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
